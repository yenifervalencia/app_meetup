<section class="w-full px-ds2-20 py-ds2-48 md:py-ds2-48">
    <!-- Img Shadow -->
    <div class="relative w-full ds2-container-lg">
        <img alt="" loading="lazy" width="1200" height="465" decoding="async" data-nimg="1"
            class="absolute hidden object-contain lg:block" [srcset]="imgUrls.shadow" [src]="imgUrls.shadow"
            style="color: transparent;">
        <div class="relative z-10 flex justify-center">
            <!-- Img desing -->
            <div class="w-full">
                <div class="overflow-hidden rounded-ds2-48">
                    <img alt="" loading="lazy" width="1200" height="465" decoding="async" data-nimg="1"
                        class="absolute hidden object-fill object-center lg:block" [srcset]="imgUrls.join"
                        [src]="imgUrls.join" style="color: transparent; z-index: 1;">
                    <!-- Information -->
                    <div class="relative z-10 mx-auto max-w-[540px] md:py-ds2-56 lg:py-[100px]">
                        <!-- Title and message -->
                        <div
                            class="mb-ds2-24 flex flex-col items-center gap-ds2-12 text-center md:px-ds2-0 md:px-ds2-20">
                            <h2 class="ds2-b24 text-ds2-text-fill-primary-enabled lg:ds2-b40">Únete a Meetup
                            </h2>
                            <p class="ds2-r16 text-ds2-text-fill-secondary-enabled md:ds2-r18">La gente usa
                                Meetup para conocer a gente nueva, aprender cosas nuevas, encontrar apoyo, salir
                                de su zona de confort y perseguir sus pasiones juntos. La membresía es gratuita.
                            </p>
                        </div>
                        <!-- Button -->

                        <div class="flex justify-center">
                            <app-button-dark [title]="'Regístrate gratis'"
                                [classB]="'inline-flex items-center justify-center rounded-ds2-max max-w-full min-w-0 select-none data-[disabled=false]:active:scale-98 data-[disabled=true]:cursor-not-allowed data-[disabled=true]:pointer-events-none hover:no-underline relative text-ds2-button-content-fill-primary-enabled data-[disabled=false]:bg-ds2-button-base-fill-primary-enabled shadow-ds2-shadow-button-base-primary-enabled hover:shadow-ds2-shadow-button-base-primary-hover active:shadow-ds2-shadow-button-base-primary-pressed data-[disabled=true]:text-ds2-button-content-fill-primary-disabled data-[disabled=true]:bg-ds2-button-base-fill-primary-disabled data-[disabled=true]:shadow-ds2-shadow-button-base-primary-disabled transition-all duration-150 before:absolute before:inset-0 before:z-0 before:bg-ds2-button-base-fill-primary-hover before:shadow-ds2-shadow-button-base-primary-hover before:rounded-ds2-max before:opacity-0 before:transition-opacity before:duration-150 data-[disabled=false]:hover:before:opacity-100 after:absolute after:inset-0 after:z-0 after:bg-ds2-button-base-fill-primary-pressed after:shadow-ds2-shadow-button-base-primary-pressed after:rounded-ds2-max after:opacity-0 after:transition-opacity after:duration-150 data-[disabled=false]:active:after:opacity-100 gap-ds2-8 ds2-m16 px-ds2-24 py-ds2-12'">
                            </app-button-dark>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
