<section *ngIf="type=='movil'" class="lg:py-0 py-ds2-24" id="your-events" aria-labelledby="your-events-title"
    role="region">
    <div class="px-ds2-20 lg:px-0 flex flex-wrap items-baseline justify-between gap-ds2-12 gap-y-ds2-20">
        <div class="flex flex-row items-baseline gap-ds2-10">
            <div id="your-events-title">
                <div class="flex items-center gap-ds2-20">
                    <button class="grid transition-all *:col-start-1 *:row-start-1" type="button">
                        <span class="opacity-0">Asistiendo
                        </span>
                        <span class="flex items-baseline">
                            <span
                                class="ds2-m16 underline underline-offset-[5px] transition-all [text-decoration-thickness:1.5px] ds2-b16 text-ds2-text-fill-primary-enabled decoration-ds2-text-underline-secondary-enabled">
                                Asistiendo
                            </span>
                        </span>
                    </button>
                    <button class="grid transition-all *:col-start-1 *:row-start-1" type="button">
                        <span class="opacity-0">Guardados
                        </span>
                        <span class="flex items-baseline">
                            <span
                                class="ds2-m16 text-ds2-text-fill-tertiary-enabled underline decoration-transparent underline-offset-[5px] transition-all [text-decoration-thickness:1.5px]">
                                Guardados
                            </span>
                        </span>
                    </button>
                </div>
            </div>
        </div>
        <app-button-purple
            [classB]="'inline-flex items-center justify-center rounded-ds2-max max-w-full relative select-none data-[disabled=false]:active:scale-98 transition-all duration-150 before:absolute before:rounded-ds2-max before:z-0 before:opacity-0 data-[disabled=false]:hover:before:opacity-100 before:transition-opacity before:duration-150 data-[disabled=true]:cursor-not-allowed data-[disabled=true]:pointer-events-none hover:no-underline text-ds2-text_button-content-fill-brand_primary-enabled hover:text-ds2-text_button-content-fill-brand_primary-hover before:bg-ds2-text_button-base-fill-shared-hover data-[disabled=true]:text-ds2-text_button-content-fill-brand_primary-disabled gap-ds2-6 ds2-m16 before:-inset-x-ds2-12 before:-inset-y-ds2-6'"
            [title]="'Ver todo'">
        </app-button-purple>
    </div>
    <div class="px-ds2-20 lg:px-0">
        <div class="flex w-full flex-1 items-center justify-center pt-ds2-24">
            <div
                class="flex w-full max-w-[300px] flex-col items-center justify-center gap-ds2-24 py-ds2-88 text-center xs:py-0 xs:gap-ds2-16">
                <div class="flex w-full flex-col items-center gap-ds2-16">
                    <div class="flex w-full flex-col items-center gap-ds2-8">
                        <h3 class="ds2-m16 text-ds2-text-fill-primary-enabled">Parece que estás
                            libre</h3>
                    </div>
                    <app-button-dark
                        [classB]="'inline-flex items-center justify-center rounded-ds2-max max-w-full min-w-0 select-none data-[disabled=false]:active:scale-98 data-[disabled=true]:cursor-not-allowed data-[disabled=true]:pointer-events-none hover:no-underline relative text-ds2-button-content-fill-primary-enabled data-[disabled=false]:bg-ds2-button-base-fill-primary-enabled shadow-ds2-shadow-button-base-primary-enabled hover:shadow-ds2-shadow-button-base-primary-hover active:shadow-ds2-shadow-button-base-primary-pressed data-[disabled=true]:text-ds2-button-content-fill-primary-disabled data-[disabled=true]:bg-ds2-button-base-fill-primary-disabled data-[disabled=true]:shadow-ds2-shadow-button-base-primary-disabled transition-all duration-150 before:absolute before:inset-0 before:z-0 before:bg-ds2-button-base-fill-primary-hover before:shadow-ds2-shadow-button-base-primary-hover before:rounded-ds2-max before:opacity-0 before:transition-opacity before:duration-150 data-[disabled=false]:hover:before:opacity-100 after:absolute after:inset-0 after:z-0 after:bg-ds2-button-base-fill-primary-pressed after:shadow-ds2-shadow-button-base-primary-pressed after:rounded-ds2-max after:opacity-0 after:transition-opacity after:duration-150 data-[disabled=false]:active:after:opacity-100 gap-ds2-8 ds2-m14 px-ds2-20 py-ds2-10'"
                        [title]="'Buscar eventos'">
                    </app-button-dark>
                </div>
            </div>
        </div>
    </div>
</section>

<section *ngIf="type=='desktop'" id="your-events-card"

                        </span>
                    </button>

        <app-button-purple
            [classB]="'inline-flex items-center justify-center rounded-ds2-max max-w-full relative select-none data-[disabled=false]:active:scale-98 transition-all duration-150 before:absolute before:rounded-ds2-max before:z-0 before:opacity-0 data-[disabled=false]:hover:before:opacity-100 before:transition-opacity before:duration-150 data-[disabled=true]:cursor-not-allowed data-[disabled=true]:pointer-events-none hover:no-underline text-ds2-text_button-content-fill-brand_primary-enabled hover:text-ds2-text_button-content-fill-brand_primary-hover before:bg-ds2-text_button-base-fill-shared-hover data-[disabled=true]:text-ds2-text_button-content-fill-brand_primary-disabled gap-ds2-4 ds2-m14 before:-inset-x-ds2-10 before:-inset-y-ds2-4'"

    <div class="flex flex-col gap-ds2-36">

                <div

                        <div class="flex w-full flex-col items-center gap-ds2-8">
                            <h3 class="ds2-m16 text-ds2-text-fill-primary-enabled">Parece que estás
                                libre</h3>
                        </div>
                        <app-button-dark
                            [classB]="'inline-flex items-center justify-center rounded-ds2-max max-w-full min-w-0 select-none data-[disabled=false]:active:scale-98 data-[disabled=true]:cursor-not-allowed data-[disabled=true]:pointer-events-none hover:no-underline relative text-ds2-button-content-fill-primary-enabled data-[disabled=false]:bg-ds2-button-base-fill-primary-enabled shadow-ds2-shadow-button-base-primary-enabled hover:shadow-ds2-shadow-button-base-primary-hover active:shadow-ds2-shadow-button-base-primary-pressed data-[disabled=true]:text-ds2-button-content-fill-primary-disabled data-[disabled=true]:bg-ds2-button-base-fill-primary-disabled data-[disabled=true]:shadow-ds2-shadow-button-base-primary-disabled transition-all duration-150 before:absolute before:inset-0 before:z-0 before:bg-ds2-button-base-fill-primary-hover before:shadow-ds2-shadow-button-base-primary-hover before:rounded-ds2-max before:opacity-0 before:transition-opacity before:duration-150 data-[disabled=false]:hover:before:opacity-100 after:absolute after:inset-0 after:z-0 after:bg-ds2-button-base-fill-primary-pressed after:shadow-ds2-shadow-button-base-primary-pressed after:rounded-ds2-max after:opacity-0 after:transition-opacity after:duration-150 data-[disabled=false]:active:after:opacity-100 gap-ds2-8 ds2-m14 px-ds2-20 py-ds2-10'"
                            [title]="'Buscar eventos'"></app-button-dark>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
